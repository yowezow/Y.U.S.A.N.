[package]
name = "yusan"
version = "1.0.0"
description = "YUSAN desktop assistant"
authors = ["YUSAN"]
edition = "2021"

[lib]
name = "yusan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
