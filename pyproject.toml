[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yusan-core"
version = "1.0.0"
description = "YUSAN assistant core"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "keyring>=25.0,<26",
  "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "pyinstaller>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["yusan_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
